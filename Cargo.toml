[package]
name = "sample_npm_docker_build"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Small Rust crate used to validate CI builds in sample-npm-docker-build."
repository = "https://github.com/ir-bhuwan-panta/sample-npm-docker-build"
readme = "README.md"
keywords = ["ci", "docker", "npm", "rust"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
